<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Públio Imóveis — Fichas de Imóveis</title>
<link rel="icon" href="logo-publio.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#0c0b09" />
<meta name="color-scheme" content="dark" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="estilo.css" />
</head>
<body>

<header class="topo">
  <div class="topo-inner">
    <div class="marca">
      <img class="logo-img" src="logo-publio.png" alt="Públio Imóveis" />
      <div>
        <h1>Públio Imóveis</h1>
        <p>Mais que imóveis, realizamos histórias</p>
        <span id="statusNuvem" class="status-nuvem">Conectando...</span>
      </div>
    </div>
    <button id="btnNovo" class="btn btn-primario">+ Novo imóvel</button>
    <button id="btnAtualizar" class="btn btn-neutro btn-mini" title="Buscar imóveis lançados em outros aparelhos">↻ Atualizar</button>
  </div>
</header>

<main class="conteudo">

  <!-- ============ PAINEL DO CORRETOR ============ -->
  <section id="painel" class="painel">
    <div class="painel-grade">

      <form id="form" class="cartao" autocomplete="off">
        <h2>Cadastrar imóvel</h2>

        <label class="campo">
          <span>Título do anúncio</span>
          <input id="f-titulo" type="text" placeholder="Ex.: Casa 3 quartos no Centro" required />
        </label>

        <div class="linha">
          <label class="campo">
            <span>Tipo</span>
            <select id="f-tipo">
              <option>Casa</option>
              <option>Apartamento</option>
              <option>Terreno</option>
              <option>Sítio / Chácara</option>
              <option>Galpão / Armazém</option>
              <option>Sala comercial</option>
            </select>
          </label>
          <label class="campo">
            <span>Finalidade</span>
            <select id="f-finalidade">
              <option>Venda</option>
              <option>Aluguel</option>
            </select>
          </label>
        </div>

        <div class="linha">
          <label class="campo">
            <span>Preço (R$)</span>
            <input id="f-preco" type="text" inputmode="decimal" placeholder="450.000,00" />
          </label>
          <label class="campo">
            <span>Cidade / Bairro</span>
            <input id="f-local" type="text" placeholder="Cidade — Bairro" />
          </label>
        </div>

        <label class="campo">
          <span>Fotos da casa (pode escolher várias)</span>
          <input id="f-imagem" type="file" accept="image/*" multiple />
        </label>
        <div id="miniaturas" class="miniaturas"></div>
        <p id="fotosInfo" class="fotos-info">Nenhuma foto escolhida</p>

        <label class="campo">
          <span>Descrição</span>
          <textarea id="f-descricao" rows="6" placeholder="Escreva aqui a descrição completa do imóvel..."></textarea>
        </label>

        <div class="acoes-form">
          <button type="submit" class="btn btn-primario" id="btnSalvar">Salvar imóvel</button>
          <button type="button" class="btn btn-neutro" id="btnLimpar">Limpar</button>
        </div>
        <p id="avisoForm" class="aviso" hidden></p>
      </form>

      <div class="cartao">
        <div class="cartao-cabecalho">
          <h2>Meus imóveis</h2>
          <input id="busca" type="search" placeholder="Buscar por título, cidade..." class="busca" />
        </div>
        <ul id="lista" class="lista"></ul>
        <p id="listaVazia" class="vazio">Nenhum imóvel cadastrado ainda.</p>
      </div>

    </div>
  </section>

  <!-- ============ FICHA PARA O CLIENTE ============ -->
  <section id="ficha" class="ficha" hidden>
    <div class="ficha-barra">
      <button class="btn btn-neutro" id="btnVoltar">← Voltar ao painel</button>
      <span class="ficha-dica">Link desta ficha — envie para o cliente:</span>
      <div class="link-box">
        <input id="linkFicha" type="text" readonly />
        <button class="btn btn-primario" id="btnCopiarLink">Copiar link</button>
      </div>
    </div>

    <article class="ficha-card">
      <div class="ficha-imagem-wrap" id="galeria">
        <img id="fichaImagem" alt="Foto do imóvel" />
        <button type="button" class="seta seta-esq" id="setaEsq" aria-label="Foto anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button type="button" class="seta seta-dir" id="setaDir" aria-label="Próxima foto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <span class="contador-fotos" id="contadorFotos" hidden></span>
      </div>

      <div class="ficha-corpo">
        <div class="ficha-topo">
          <div>
            <p id="fichaEtiqueta" class="etiqueta"></p>
            <h2 id="fichaTitulo"></h2>
            <p id="fichaLocal" class="local"></p>
          </div>
          <p id="fichaPreco" class="preco"></p>
        </div>

        <h3 class="rotulo-desc">Descrição do imóvel</h3>
        <p id="fichaDescricao" class="descricao"></p>

        <div class="ficha-acoes">
          <a id="btnBaixarImagem" class="btn btn-primario" download>⬇ Baixar esta foto</a>
          <button id="btnBaixarTodas" class="btn btn-primario">⬇ Baixar todas (.zip)</button>
          <button id="btnCopiarDescricao" class="btn btn-destaque">⧉ Copiar descrição</button>
          <button id="btnCopiarTudo" class="btn btn-neutro">⧉ Copiar imagem + descrição</button>
        </div>
        <div id="miniaturasFicha" class="miniaturas-ficha" hidden></div>
        <p id="avisoFicha" class="aviso" hidden></p>
      </div>
    </article>
  </section>

</main>

<script src="fflate.min.js"></script>
<script src="app.js"></script>
</body>
</html>
